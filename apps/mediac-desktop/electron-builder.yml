appId: com.mediac.desktop
productName: MediaCli
asar: true
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
  - '!**/*.map'
extraResources:
  - from: ../../presets
    to: presets
    filter:
      - '**/*'
asarUnpack:
  - resources/**
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
    - zip
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
portable:
  artifactName: ${productName}-${version}-portable.${ext}

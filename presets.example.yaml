# ===========================================
# MediaCli FFmpeg 预设配置示例文件（不会被自动加载）
# ===========================================
#
# ⚠️ 本文件是**示例**，不作为内置预设加载：
#   - 内置预设的唯一来源是随包发布的 presets/default.yaml（见其顶部说明）
#   - 想自定义/覆盖/新增预设：
#       1. 复制本文件到 ~/.mediac/presets.yaml （对当前用户全部项目生效）
#       2. 或复制到 <项目目录>/presets.yaml       （仅对当前项目生效）
#
# 分层加载顺序（低 → 高优先级，同名且低层已存在时）:
#   1. presets/default.yaml   （内置层，总是存在）
#   2. ~/.mediac/presets.yaml
#   3. <项目>/presets.yaml
#
# 同名覆盖规则（P0-1 修复）:
#   - 与默认预设同名的自定义预设，必须显式声明 `_override: true` 才会覆盖，
#     否则会被跳过并在日志中告警（防止旧式/同名预设静默架空内置 S-4 预设）。
#   - 新增的预设名（如 hevc_qsv2k / hevc_qsv2km）无需 `_override`，直接生效。
#
# S-4 字段约定（与 v2.0 硬编码时代的关键差异）:
#   - videoCodecFamily : 只声明输出 codec 族 (h264|hevc|av1|vp9)，
#                        具体编码器由 lib/hwaccel.js 按 tier(解码层) 决定
#   - videoArgs        : 只放硬件无关参数，**禁止 -c:v 硬编码编码器**
#   - filters          : "{scaleFilter}" 占位符，缩放滤镜由 tier 层按
#                        实际硬件（scale_cuda/scale_qsv/vpp_amf/scale）生成
#   - pre_filters      : 缩放前滤镜（三段式，可选）
#   - post_filters     : 缩放后滤镜（三段式，可选）
#
# 模板变量:
#   {videoBitrateK}  - 视频码率 (Kbps)
#   {audioBitrateK}  - 音频码率 (Kbps)
#   {videoQuality}   - 视频质量值
#   {audioQuality}   - 音频质量值
#   {dimension}      - 视频尺寸
#   {framerate}      - 帧率
#   {speed}          - 速度倍率
#   {preset}         - 预设名称
# ===========================================

# ===========================================
# 基础预设 (作为模板，不会被直接使用)
# ===========================================

# H.264/AVC 基础预设 (输出 codec 族: h264)
_base_h264:
    format: ".mp4"
    type: video
    prefix: "[SHANA] "
    suffix: "_{preset}"
    smartBitrate: true
    dimension: 3840
    framerate: 0
    speed: 0
    videoCodecFamily: "h264"
    # 编码器与质量 flag 由 lib/hwaccel.js 按 tier 生成 (nvenc->-cq, qsv->-global_quality, x264->-crf)
    videoArgs: ""
    audioArgs: "-c:a aac -b:a {audioBitrateK}"
    # 缩放滤镜占位符，由 tier 层替换为 scale_cuda / scale_qsv / vpp_amf / scale
    filters: "{scaleFilter}"
    inputArgs: ""
    streamArgs: "-map_metadata 0 -map_metadata:s:v 0:s:v"
    outputArgs: "-movflags +faststart -movflags use_metadata_tags"

# H.265/HEVC 基础预设 (输出 codec 族: hevc)
_base_hevc:
    format: ".mp4"
    type: video
    prefix: "[SHANA] "
    suffix: "_{preset}"
    smartBitrate: true
    dimension: 3840
    framerate: 0
    speed: 0
    videoCodecFamily: "hevc"
    videoArgs: ""
    audioArgs: "-c:a aac -b:a {audioBitrateK}"
    filters: "{scaleFilter}"
    inputArgs: ""
    streamArgs: "-map_metadata 0 -map_metadata:s:v 0:s:v"
    outputArgs: "-movflags +faststart -movflags use_metadata_tags"

# HEVC QSV 基础预设示例
# 说明: S-4 化后 QSV 不再需要专属基类，编码器由 tier 层自动选择；
#       保留此示例仅为演示"继承"写法，实际使用可直接 extends _base_hevc。
_base_hevc_qsv:
    extends: _base_hevc
    videoCodecFamily: "hevc"
    videoArgs: ""
    filters: "{scaleFilter}"

# AAC CBR 基础预设
_base_aac_cbr:
    format: ".m4a"
    type: audio
    prefix: ""
    suffix: "_{audioBitrateK}"
    smartBitrate: true
    videoArgs: ""
    audioArgs: "-map 0:a -c:a aac -b:a {audioBitrateK}"
    inputArgs: ""
    streamArgs: "-vn -map_metadata 0 -map_metadata:s:a 0:s:a"
    outputArgs: "-movflags +faststart -movflags use_metadata_tags"


# ===========================================
# H.264 视频预设（与内置同名，示例覆盖需 _override: true）
# ===========================================

# 2K 标准 (1920p, 质量24, 码率4M)
h264_2k:
    _override: true
    extends: _base_h264
    videoQuality: 24
    videoBitrate: 4000000 # 4 Mbps
    audioBitrate: 192000 # 192 Kbps
    dimension: 1920

# 2K 中等 (1920p, 质量26, 码率2M)
h264_2km:
    _override: true
    extends: _base_h264
    videoQuality: 26
    videoBitrate: 2000000 # 2 Mbps
    audioBitrate: 128000 # 128 Kbps
    dimension: 1920

# 2K 低质量 (1920p, 质量26, 码率1.6M)
h264_2kl:
    _override: true
    extends: _base_h264
    videoQuality: 26
    videoBitrate: 1600000 # 1.6 Mbps
    audioBitrate: 96000 # 96 Kbps
    dimension: 1920

# ===========================================
# HEVC 视频预设（与内置同名，示例覆盖需 _override: true）
# ===========================================

# 4K 超高质量 (3840p, 质量20, 码率16M)
hevc_4ku:
    _override: true
    extends: _base_hevc
    videoQuality: 20
    videoBitrate: 16000000 # 16 Mbps
    audioBitrate: 256000 # 256 Kbps
    dimension: 3840

# 4K 高质量 (3840p, 质量22, 码率10M)
hevc_4k:
    _override: true
    extends: _base_hevc
    videoQuality: 22
    videoBitrate: 10000000 # 10 Mbps
    audioBitrate: 256000 # 256 Kbps
    dimension: 3840

# 4K 中等 (3840p, 质量24, 码率6M)
hevc_4kl:
    _override: true
    extends: _base_hevc
    videoQuality: 24
    videoBitrate: 6000000 # 6 Mbps
    audioBitrate: 256000 # 256 Kbps
    dimension: 3840

# 4K 低质量 (3840p, 质量26, 码率4M)
hevc_4kt:
    _override: true
    extends: _base_hevc
    videoQuality: 26
    videoBitrate: 4000000 # 4 Mbps
    audioBitrate: 192000 # 192 Kbps
    dimension: 3840

# 2K 超高质量 (1920p, 质量22, 码率8M)
hevc_2ku:
    _override: true
    extends: _base_hevc
    videoQuality: 22
    videoBitrate: 8000000 # 8 Mbps
    audioBitrate: 256000 # 256 Kbps
    dimension: 1920

# 2K 高质量 (1920p, 质量22, 码率6M)
hevc_2kh:
    _override: true
    extends: _base_hevc
    videoQuality: 22
    videoBitrate: 6000000 # 6 Mbps
    audioBitrate: 256000 # 256 Kbps
    dimension: 1920

# 2K 标准 (1920p, 质量24, 码率4M) - 默认推荐
hevc_2k:
    _override: true
    extends: _base_hevc
    videoQuality: 24
    videoBitrate: 4000000 # 4 Mbps
    audioBitrate: 192000 # 192 Kbps
    dimension: 1920

# 2K 中等 (1920p, 质量26, 码率2M)
hevc_2km:
    _override: true
    extends: _base_hevc
    videoQuality: 26
    videoBitrate: 2000000 # 2 Mbps
    audioBitrate: 128000 # 128 Kbps
    dimension: 1920

# 2K 低质量 (1920p, 质量26, 码率1.6M)
hevc_2kl:
    _override: true
    extends: _base_hevc
    videoQuality: 26
    videoBitrate: 1600000 # 1.6 Mbps
    audioBitrate: 128000 # 128 Kbps
    dimension: 1920

# 2K 极低 (1920p, 质量28, 码率1.2M, 30fps)
hevc_2kt:
    _override: true
    extends: _base_hevc
    videoQuality: 28
    videoBitrate: 1200000 # 1.2 Mbps
    audioBitrate: 96000 # 96 Kbps
    dimension: 1920
    framerate: 30
    smartBitrate: false

# ===========================================
# HEVC QSV 视频预设（新增示例，非内置，复制即生效）
# ===========================================

# QSV 2K 标准（S-4: 编码器由 tier 自动选择，无需 -c:v hevc_qsv）
hevc_qsv2k:
    extends: _base_hevc_qsv
    videoQuality: 26
    videoBitrate: 4000000
    audioBitrate: 192000
    dimension: 1920

# QSV 2K 中等
hevc_qsv2km:
    extends: _base_hevc_qsv
    videoQuality: 28
    videoBitrate: 2000000
    audioBitrate: 128000
    dimension: 1920

# ===========================================
# 特殊视频预设（与内置同名，示例覆盖需 _override: true）
# ===========================================

# 极速模式 - 适用于视频教程/演讲
# 支持变速播放，低码率，小文件
# 注意: complexFilter 内仍是字面量 scale_cuda 写法，
#       模板化 ({scaleFilter} 替换) 由复杂滤镜分层改造阶段处理
hevc_speed:
    _override: true
    extends: _base_hevc
    videoQuality: 30
    videoBitrate: 500000 # 500 Kbps
    audioQuality: 1 # HE-AAC VBR 1
    audioBitrate: 48000 # 48 Kbps
    dimension: 1920
    speed: 1.5
    framerate: 25
    smartBitrate: false
    suffix: "_{speed}x"
    # HE-AAC 编码，更低码率
    audioArgs: "-c:a aac -b:a {audioBitrateK}"
    # 使用复杂滤镜实现变速
    filters: ""
    complexFilter: "[0:v]setpts=PTS/{speed},scale_cuda='if(gte(iw,ih),min({dimension},iw),-2)':'if(lt(iw,ih),min({dimension},ih),-2)':interp_algo=lanczos,fps={framerate}[v];[0:a]atempo={speed}[a]"
    streamArgs: "-map [v] -map [a]"

# ===========================================
# 音频预设（与内置同名，示例覆盖需 _override: true）
# ===========================================

# 从视频中提取音频 (复制音频流)
audio_extract:
    _override: true
    extends: _base_aac_cbr
    prefix: ""
    suffix: "_audio"
    audioBitrate: 192000
    audioArgs: "-c:a copy"
    streamArgs: "-vn -map 0:a:0 -map_metadata 0 -map_metadata:s:a 0:s:a"

# AAC 高码率 (320 Kbps)
aac_high:
    _override: true
    extends: _base_aac_cbr
    audioBitrate: 320000

# AAC 中码率 (192 Kbps)
aac_medium:
    _override: true
    extends: _base_aac_cbr
    audioBitrate: 192000

# AAC 低码率 (128 Kbps)
aac_low:
    _override: true
    extends: _base_aac_cbr
    audioBitrate: 128000

# AAC HE (高效编码，适合低码率)
aac_he:
    _override: true
    extends: _base_aac_cbr
    smartBitrate: false
    audioQuality: 2
    audioBitrate: 72000 # 72 Kbps
    audioArgs: "-map 0:a -c:a aac -b:a {audioBitrateK}"

# AAC 人声 (极低码率，适合语音)
aac_voice:
    _override: true
    extends: _base_aac_cbr
    smartBitrate: false
    audioBitrate: 48k # 48 Kbps

# ===========================================
# 码率参考表
# ===========================================
#
# YouTube 推荐视频码率 (SDR):
# ┌─────────┬───────────────┬────────────────┐
# │ 分辨率  │ 标准码率      │ 高质量码率     │
# ├─────────┼───────────────┼────────────────┤
# │ 8K      │ 80-160 Mbps   │ 120-240 Mbps   │
# │ 4K      │ 35-45 Mbps    │ 53-68 Mbps     │
# │ 1440p   │ 16 Mbps       │ 24 Mbps        │
# │ 1080p   │ 8 Mbps        │ 12 Mbps        │
# │ 720p    │ 5 Mbps        │ 7.5 Mbps       │
# │ 480p    │ 2.5 Mbps      │ 4 Mbps         │
# │ 360p    │ 1 Mbps        │ 1.5 Mbps       │
# └─────────┴───────────────┴────────────────┘
#
# HEVC NVENC CQ 模式码率参考:
# ┌───────┬──────────┐
# │ CQ值  │ 码率     │
# ├───────┼──────────┤
# │ 22    │ ~16 Mbps │
# │ 24    │ ~12 Mbps │
# │ 26    │ ~9 Mbps  │
# │ 28    │ ~6 Mbps  │
# │ 30    │ ~5 Mbps  │
# │ 32    │ ~4 Mbps  │
# │ 34    │ ~3 Mbps  │
# │ 36    │ ~2 Mbps  │
# │ 38    │ ~1.5 Mbps│
# │ 40    │ ~1.3 Mbps│
# │ 42    │ ~1 Mbps  │
# │ 50    │ ~600 Kbps│
# └───────┴──────────┘
#
# AAC VBR 质量等级:
# ┌─────┬────────────────┬─────────────────┐
# │ VBR │ kbps/channel   │ 编码类型        │
# ├─────┼────────────────┼─────────────────┤
# │ 1   │ 20-32          │ LC, HE, HEv2    │
# │ 2   │ 32-40          │ LC, HE, HEv2    │
# │ 3   │ 48-56          │ LC, HE, HEv2    │
# │ 4   │ 64-72          │ LC              │
# │ 5   │ 96-112         │ LC              │
# └─────┴────────────────┴─────────────────┘

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 与 package.json#engines 保持一致；测试入口使用 Node 21+ 的 glob 位置参数
        node-version: [22.x, 24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 语法检查：覆盖全仓库 *.js，并校验运行时版本与 package.json engines 一致
      - name: Syntax check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
